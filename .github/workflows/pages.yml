# public/ 을 그대로 GitHub Pages 에 배포한다(빌드·외부 데이터 수집 없음).
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 deploy 가 성공한다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 목업 시나리오 검증: 좌초·충돌·정체가 있으면 배포하지 않는다
      - run: node scripts/check-scenario.js 48
      - run: touch public/.nojekyll
      # 배포마다 CSS·JS 주소를 바꿔 브라우저가 이전 버전 파일을 섞어 쓰지 않게 한다
      - name: cache-bust
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$v/g" public/*.html
          sed -i -E "s#(from '\./[a-z0-9-]+\.js)'#\1?v=$v'#g" public/js/*.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
